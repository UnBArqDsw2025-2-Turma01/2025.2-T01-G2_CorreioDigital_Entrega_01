name: Deploy Docsify to GitHub Pages

on:
  push:
    branches:
      - main   # Só roda quando tiver merge/commit na main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Instala Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Instala docsify-cli (opcional, só se precisar rodar local)
      - name: Install docsify
        run: npm install -g docsify-cli

      # 4. Faz o deploy do conteúdo da pasta docs para o branch gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
